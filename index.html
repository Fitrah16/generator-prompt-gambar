<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Prompt Gambar untuk ChatGPT</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1d1740;--mut:#6a6590;--line:#ddd8f5;--pri:#5b3df5;--pri2:#8a5cff;--ok:#0a8f5b;--err:#c62839}
@media (prefers-color-scheme:dark){:root{--bg:#120f26;--card:#1c1838;--ink:#f0eeff;--mut:#a9a3d4;--line:#332d5e;--pri:#8a74ff;--pri2:#b38cff;--ok:#3ddc97;--err:#ff6b7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
label small{font-weight:400;color:var(--mut)}
input,select,textarea,.cdd-btn{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible,.cdd-btn:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--pri);background:transparent;color:var(--pri);padding:9px 14px;font-weight:600}
button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
.st{font-size:13px;margin-top:6px;min-height:18px}
.st.ok{color:var(--ok)}.st.err{color:var(--err)}
.cdd{position:relative}
.cdd-btn{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.sw{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.15);flex:none}
.sw i{display:block;width:18px;height:18px}
.cdd-list{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;max-height:280px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none}
.cdd.open .cdd-list{display:block}
.opt{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer}
.opt:hover,.opt.sel{background:var(--bg)}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.pal div{height:74px;display:flex;align-items:flex-end;padding:6px;font:600 12px ui-monospace,Consolas,monospace}
.out{width:100%;min-height:300px;font:13.5px/1.55 ui-monospace,Consolas,monospace}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{color:var(--mut);font-size:12.5px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{border-radius:999px;padding:8px 16px}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>Generator prompt gambar untuk ChatGPT</h1>
<p class="sub">Pilih jenis prompt, isi data produk, lalu salin hasilnya ke ChatGPT.</p>

<div class="card" style="margin-bottom:14px">
<h2>API Gemini</h2>
<div class="row">
<div><label for="key">API key Gemini</label>
<div class="keyrow"><input id="key" type="password" placeholder="Tempel API key di sini" autocomplete="off"><button id="eye" type="button" title="Tampilkan atau sembunyikan">Lihat</button></div></div>
<div><label for="model">Model</label>
<select id="model"><option>gemini-2.5-flash</option><option>gemini-2.5-flash-lite</option><option>gemini-2.5-pro</option><option>gemini-2.0-flash</option></select></div>
</div>
<div class="acts"><button id="test" type="button" class="p">Tes API</button></div>
<div id="tst" class="st" role="status"></div>
<div class="note">API key disimpan hanya di browser ini. API key tidak wajib untuk tombol "Buat prompt".</div>
</div>

<div class="tabs" role="tablist" aria-label="Jenis prompt">
<button type="button" class="tab" role="tab" data-m="img" aria-selected="true">Prompt gambar</button>
<button type="button" class="tab" role="tab" data-m="cap" aria-selected="false">Caption TikTok</button>
<button type="button" class="tab" role="tab" data-m="lynk" aria-selected="false">Paket Lynk.id</button>
</div>

<div class="grid">
<div class="card">
<h2>Isi desain</h2>
<div class="row m-img">
<div><label for="jenis">Jenis desain</label>
<select id="jenis"></select></div>
<div><label for="rasio">Rasio</label>
<select id="rasio"></select></div>
</div>
<label for="judul" id="lj"></label>
<input id="judul" placeholder="Contoh: PROMO RAMADAN">
<label for="sub" id="ls"></label>
<input id="sub" placeholder="Contoh: Diskon hingga 50% semua produk">
<label for="isi" id="li"></label>
<textarea id="isi" placeholder="Contoh: Buku Paket Kelas 4 - Modul Ajar - Soal PTS&#10;Hubungi: 0812-xxxx-xxxx"></textarea>
<div class="m-vis">
<label for="objek">Objek atau tokoh utama <small>(opsional)</small></label>
<input id="objek" placeholder="Contoh: guru dan siswa SD tersenyum memegang buku">
<label for="latar">Latar dan suasana <small>(opsional)</small></label>
<input id="latar" placeholder="Contoh: ruang kelas cerah dengan jendela besar">
</div>
</div>

<div class="card" id="tamp">
<h2>Tampilan</h2>
<label for="gaya">Gaya visual</label><select id="gaya"></select>
<label for="cahaya">Pencahayaan dan tekstur</label><select id="cahaya"></select>
<label for="resol">Resolusi dan ketajaman</label><select id="resol"></select>
<label>Skema warna <small>(50 pilihan)</small></label>
<div class="cdd" id="cdd">
<button type="button" class="cdd-btn" id="cbtn" aria-haspopup="listbox" aria-expanded="false"></button>
<div class="cdd-list" id="clist" role="listbox"></div>
</div>
<div class="pal" id="pal"></div>
</div>
</div>

<div class="card hide" id="detail" style="margin-top:14px">
<h2>Detail produk</h2>
<div class="row">
<div><label for="harga">Harga atau promo <small>(opsional)</small></label><input id="harga" placeholder="Contoh: Rp49.000, diskon 30% sampai Minggu"></div>
<div><label for="target">Target pembeli <small>(opsional)</small></label><input id="target" placeholder="Contoh: guru SD dan kepala sekolah"></div>
</div>
<div class="row">
<div><label for="bahasa">Gaya bahasa</label>
<select id="bahasa"><option>Santai dan akrab</option><option>Profesional dan meyakinkan</option><option>Persuasif (jualan langsung)</option><option>Islami dan santun</option><option>Lucu ala Gen Z</option><option>Edukatif dan informatif</option></select></div>
<div class="m-cap"><label for="cta">Ajakan bertindak <small>(opsional)</small></label><input id="cta" placeholder="Contoh: Klik link di bio untuk beli"></div>
</div>
<div class="row m-cap">
<div><label for="panjang">Panjang caption</label>
<select id="panjang"><option>pendek, sekitar 100 karakter</option><option selected>sedang, 150 sampai 300 karakter</option><option>panjang, 300 sampai 600 karakter</option></select></div>
<div><label for="hashtag">Jumlah hashtag</label>
<select id="hashtag"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div>
</div>
</div>

<div class="card" style="margin-top:14px">
<h2 id="oh">Prompt gambar untuk ChatGPT</h2>
<textarea id="out" class="out" placeholder="Hasil prompt muncul di sini."></textarea>
<div class="acts">
<button id="build" type="button" class="p">Buat prompt</button>
<button id="ai" type="button">Sempurnakan dengan Gemini</button>
<button id="copy" type="button">Salin</button>
</div>
<div id="ost" class="st" role="status"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const JENIS=["Poster","Thumbnail YouTube","Pengumuman","Cover buku","Cover modul ajar","Banner promosi","Flyer","Undangan","Sertifikat","Story Instagram","Brosur","Cover presentasi"];
const RASIO=["1:1 (persegi)","4:5 (potret)","9:16 (story/vertikal)","16:9 (lanskap/thumbnail)","3:4 (potret)","A4 potret","A4 lanskap"];
const GAYA=[
["3D Pixar style","3D Pixar style animation, friendly expressive characters, rounded shapes, warm and lively"],
["Disney style animation","Disney style animation, charming characters, magical storybook feeling, expressive faces"],
["Claymation smooth","claymation-like smooth texture, soft handmade clay look, playful and friendly"],
["Flat vector modern","clean flat vector illustration, bold simple shapes, modern and friendly"],
["Isometric 3D","isometric 3D illustration, tidy geometric scene, soft pastel depth"],
["Glossy 3D icons","glossy 3D icon style, inflated rounded objects, shiny plastic finish"],
["Paper cut berlapis","layered paper cut art, handmade craft look, depth between layers"],
["Cat air (watercolor)","soft watercolor illustration, gentle brush texture, airy and warm"],
["Anime lembut","soft anime illustration style, clean line art, bright cheerful atmosphere"],
["Low poly 3D","low poly 3D render, faceted shapes, clean modern look"],
["Pop art komik","comic pop art style, bold outlines, halftone dots, energetic"],
["Retro vintage poster","vintage retro poster style, textured print feel, classic typography mood"],
["Synthwave neon","80s synthwave neon style, glowing grid, futuristic energy"],
["Doodle gambar tangan","hand-drawn doodle style, playful sketch lines, cheerful"],
["Fotorealistik","photorealistic commercial photography style, natural and polished"],
["Minimalis elegan","minimalist elegant design, generous whitespace, refined and calm"]];
const CAHAYA=[
["Sinematik lengkap","cinematic lighting, soft shadows, ultra-detailed 3D textures"],
["Studio lembut","soft studio lighting, gentle diffused shadows, smooth surfaces"],
["Golden hour hangat","warm golden hour lighting, long soft shadows, glowing highlights"],
["Rim light dramatis","dramatic rim lighting, strong depth separation, glowing edges"],
["Sinar volumetrik","volumetric light rays, soft atmospheric haze, depth"],
["Neon glow","vivid neon glow, colored light reflections, luminous highlights"],
["Bokeh latar blur","shallow depth of field, creamy bokeh background, subject in focus"],
["Pantulan mengkilap","glossy reflective surfaces, realistic light reflections, specular highlights"],
["Matte lembut","soft matte textures, subtle ambient occlusion, gentle light"],
["Subsurface scattering","subsurface scattering on skin and clay, soft translucent glow"],
["Kontras tinggi","high contrast lighting, deep shadows, bright highlights"],
["Cerah merata","bright even lighting, minimal shadows, clean and clear"]];
const RESOL=[
["Hyper-detailed 8K","hyper-detailed, sharp focus, 8k resolution"],
["Ultra tajam 4K","ultra sharp, crisp details, 4k resolution"],
["Siap cetak 300 dpi","print-ready, high resolution, 300 dpi, crisp edges, clean text"],
["Detail fotorealistik","photorealistic fine detail, razor-sharp focus, high dynamic range"],
["Tepi vektor bersih","clean sharp vector edges, high resolution, no blur or noise"],
["Standar HD","full HD, clear and sharp"]];
const WARNA=`Otomatis (AI memilih)|
Sunset Hangat|#FF6B35,#F7931E,#FFD23F,#C1121F
Samudra Biru|#03045E,#0077B6,#00B4D8,#CAF0F8
Hutan Tropis|#1B4332,#2D6A4F,#52B788,#D8F3DC
Permen Pastel|#FFADAD,#FFD6A5,#CAFFBF,#A0C4FF
Royal Emas|#1A1A2E,#16213E,#C9A227,#F5E6A8
Neon Malam|#0D0221,#FF00A0,#00F0FF,#F9F871
Merah Putih|#D90429,#FFFFFF,#8D0801,#EDF2F4
Islami Hijau Emas|#0B6E4F,#08A045,#D4AF37,#F6F1D1
Langit Cerah|#4CC9F0,#4895EF,#4361EE,#F8F9FA
Lavender Lembut|#9D8DF1,#C8B6FF,#E7C6FF,#F3E8FF
Retro Mustard|#E9C46A,#F4A261,#E76F51,#264653
Monokrom Elegan|#111111,#444444,#999999,#F5F5F5
Mint Segar|#2EC4B6,#CBF3F0,#FFBF69,#FF9F1C
Sakura|#FFB7C5,#FF8FAB,#FFC2D1,#FFF0F3
Bumi Tanah|#5E3023,#895737,#C08552,#F3E9DC
Galaksi Ungu|#10002B,#3C096C,#7B2CBF,#E0AAFF
Lemon Ceria|#FFF275,#FF8C42,#FF3C38,#A23E48
Es Krim|#FFC8DD,#BDE0FE,#A2D2FF,#FFAFCC
Pantai Tropis|#00A8CC,#FFE5A5,#FF6F59,#254441
Kopi Susu|#4B2E2A,#7F5539,#B08968,#EDE0D4
Navy Profesional|#0A2342,#2CA58D,#84BC9C,#F6F4D2
Marun Mewah|#590D22,#800F2F,#C9184A,#FFB3C1
Zamrud Kristal|#064E3B,#10B981,#6EE7B7,#ECFDF5
Oranye Energik|#FF5400,#FF9100,#FFBD00,#FFF3B0
Musim Gugur|#8C2F39,#B23A48,#E09F3E,#335C67
Salju Dingin|#E0FBFC,#C2DFE3,#9DB4C0,#5C6B73
Cyberpunk|#FF2E63,#252A34,#08D9D6,#EAEAEA
Hijau Apel|#6A994E,#A7C957,#F2E8CF,#BC4749
Ungu Ceria|#7209B7,#B5179E,#F72585,#4CC9F0
Kuning Hitam Tegas|#FFD600,#111111,#FFFFFF,#FF3D00
Tosca Modern|#006D77,#83C5BE,#EDF6F9,#FFDDD2
Peach Fuzz|#FFBE98,#FFD3B6,#FFAAA5,#FF8B94
Biru Tua Emas|#0B132B,#1C2541,#3A506B,#FFD166
Hijau Neon|#0B3D0B,#39FF14,#CCFF00,#101010
Karamel Manis|#7F4F24,#B6783A,#DDA15E,#FEFAE0
Pelangi Cerah|#EF476F,#FFD166,#06D6A0,#118AB2
Rose Gold|#B76E79,#E8B4B8,#F4D9D0,#6D4C41
Biru Es|#CAF0F8,#90E0EF,#48CAE4,#0096C7
Terakota|#9C4A2F,#D17A4E,#E6B88A,#F5E1C8
Zaitun Natural|#606C38,#283618,#FEFAE0,#DDA15E
Magenta Bold|#C9184A,#FF4D6D,#FF758F,#FFCCD5
Senja Ungu|#355070,#6D597A,#B56576,#E56B6F
Kuning Matahari|#FFB703,#FB8500,#219EBC,#023047
Abu Industrial|#2B2D42,#8D99AE,#EDF2F4,#EF233C
Hijau Sekolah|#1D7874,#679289,#F4C095,#EE2E31
Biru Putih Bersih|#1D4ED8,#3B82F6,#BFDBFE,#FFFFFF
Coklat Kayu|#3E2723,#6D4C41,#A1887F,#D7CCC8
Ungu Emas Kerajaan|#2D0A4E,#6A0DAD,#D4AF37,#FFF8DC
Jeruk Segar|#F77F00,#FCBF49,#EAE2B7,#003049
Magenta Cyan Pop|#FF006E,#8338EC,#3A86FF,#FFBE0B`.split("\n").map(l=>{const[n,c]=l.split("|");return{n,c:c?c.split(","):[]}});

function fill(id,arr){const s=$(id);arr.forEach((a,i)=>{const o=document.createElement("option");o.value=i;o.textContent=Array.isArray(a)?a[0]:a;s.appendChild(o)})}
fill("jenis",JENIS);fill("rasio",RASIO);fill("gaya",GAYA);fill("cahaya",CAHAYA);fill("resol",RESOL);

let wi=0;
const swHTML=c=>c.length?'<span class="sw">'+c.map(x=>'<i style="background:'+x+'"></i>').join("")+'</span>':'<span class="sw"><i style="background:linear-gradient(135deg,#f66,#fc3,#6c6,#39f)"></i></span>';
function renderWarna(){
  const b=$("cbtn"),w=WARNA[wi];
  b.innerHTML=swHTML(w.c)+'<span>'+w.n+'</span>';
  const p=$("pal");
  p.style.display=w.c.length?"grid":"none";
  p.innerHTML=w.c.map(x=>{const r=parseInt(x.slice(1,3),16),g=parseInt(x.slice(3,5),16),bl=parseInt(x.slice(5,7),16);const L=(0.299*r+0.587*g+0.114*bl)/255;return '<div style="background:'+x+';color:'+(L>.6?"#111":"#fff")+'">'+x+'</div>'}).join("");
  document.querySelectorAll(".opt").forEach((o,i)=>o.classList.toggle("sel",i===wi));
}
$("clist").innerHTML=WARNA.map((w,i)=>'<div class="opt" role="option" data-i="'+i+'">'+swHTML(w.c)+'<span>'+(i?i+". ":"")+w.n+'</span></div>').join("");
$("clist").addEventListener("click",e=>{const o=e.target.closest(".opt");if(!o)return;wi=+o.dataset.i;renderWarna();$("cdd").classList.remove("open")});
$("cbtn").addEventListener("click",()=>{const c=$("cdd");c.classList.toggle("open");$("cbtn").setAttribute("aria-expanded",c.classList.contains("open"))});
document.addEventListener("click",e=>{if(!e.target.closest("#cdd"))$("cdd").classList.remove("open")});
renderWarna();

try{$("key").value=localStorage.getItem("gk")||"";const m=localStorage.getItem("gm");if(m)$("model").value=m}catch(e){}
$("key").addEventListener("change",()=>{try{localStorage.setItem("gk",$("key").value.trim())}catch(e){}});
$("model").addEventListener("change",()=>{try{localStorage.setItem("gm",$("model").value)}catch(e){}});
$("eye").addEventListener("click",()=>{const k=$("key");const h=k.type==="password";k.type=h?"text":"password";$("eye").textContent=h?"Sembunyi":"Lihat"});

function msg(id,t,c){const e=$(id);e.textContent=t;e.className="st "+(c||"")}

async function gemini(text,system){
  const key=$("key").value.trim();
  if(!key)throw new Error("API key belum diisi.");
  const body={contents:[{parts:[{text}]}]};
  if(system)body.systemInstruction={parts:[{text:system}]};
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+$("model").value+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||("Kode galat "+r.status));
  const t=(((j.candidates||[])[0]||{}).content||{}).parts;
  if(!t)throw new Error("Respons kosong dari Gemini.");
  return t.map(p=>p.text||"").join("").trim();
}

$("test").addEventListener("click",async()=>{
  const b=$("test");b.disabled=true;msg("tst","Menguji koneksi...");
  try{
    try{localStorage.setItem("gk",$("key").value.trim())}catch(e){}
    const t=await gemini("Balas dengan satu kata saja: OK");
    msg("tst","API berfungsi. Model "+$("model").value+" membalas: "+t.slice(0,40),"ok");
  }catch(e){msg("tst","Gagal: "+e.message,"err")}
  b.disabled=false;
});

function data(){
  return{
    jenis:JENIS[$("jenis").value],rasio:RASIO[$("rasio").value],
    judul:$("judul").value.trim(),sub:$("sub").value.trim(),isi:$("isi").value.trim(),
    objek:$("objek").value.trim(),latar:$("latar").value.trim(),
    gaya:GAYA[$("gaya").value][1],cahaya:CAHAYA[$("cahaya").value][1],resol:RESOL[$("resol").value][1],
    warna:WARNA[wi],
    harga:$("harga").value.trim(),target:$("target").value.trim(),bahasa:$("bahasa").value,
    panjang:$("panjang").value,hashtag:$("hashtag").value,cta:$("cta").value.trim()
  };
}
function build(d){
  const L=[];
  L.push("Create a "+d.jenis.toLowerCase()+" design, aspect ratio "+d.rasio+".");
  L.push("Visual style: "+d.gaya+".");
  L.push("Lighting and texture: "+d.cahaya+".");
  L.push("Quality: "+d.resol+".");
  L.push(d.warna.c.length?"Color palette: "+d.warna.n+" ("+d.warna.c.join(", ")+"). Use these colors consistently and keep strong contrast between text and background.":"Color palette: choose a harmonious palette that fits the topic, with strong contrast between text and background.");
  if(d.objek)L.push("Main visual: "+d.objek+".");
  if(d.latar)L.push("Background and mood: "+d.latar+".");
  L.push("");
  L.push("TEXT TO RENDER (copy every word exactly as written, in the original language, with correct spelling):");
  L.push('1. TITLE: "'+d.judul+'" - extremely large, bold, the most dominant element, perfectly legible, placed prominently.');
  if(d.sub)L.push('2. SUBTITLE: "'+d.sub+'" - fairly large, directly below the title, clearly readable.');
  if(d.isi)L.push((d.sub?"3":"2")+'. MAIN CONTENT: "'+d.isi.replace(/\n+/g," | ")+'" - large, clearly visible, neatly arranged with good spacing.');
  L.push("");
  L.push("Composition: clear visual hierarchy with title first, then subtitle, then content. Balanced layout, comfortable margins, text never overlaps important visual details.");
  L.push("Avoid: extra or invented text, misspelled words, blurry or tiny text, watermarks, logos, cluttered layout, distorted hands or faces.");
  return L.join("\n");
}

let mode="img";
const LAB={
 img:{lj:"Judul <small>(wajib, tampil sangat besar)</small>",ls:"Sub judul <small>(opsional, tampil cukup besar)</small>",li:"Isi produk / pengumuman <small>(tampil besar dan jelas)</small>",oh:"Prompt gambar untuk ChatGPT",ai:"Sempurnakan dengan Gemini"},
 cap:{lj:"Nama produk <small>(wajib)</small>",ls:"Tagline <small>(opsional)</small>",li:"Isi produk <small>(fitur, isi paket, manfaat)</small>",oh:"Prompt caption TikTok untuk ChatGPT",ai:"Hasilkan caption dengan Gemini"},
 lynk:{lj:"Nama produk <small>(wajib)</small>",ls:"Tagline <small>(opsional)</small>",li:"Isi produk <small>(fitur, isi paket, manfaat)</small>",oh:"Prompt paket Lynk.id untuk ChatGPT",ai:"Hasilkan paket dengan Gemini"}
};
function setMode(m){
  mode=m;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.m===m));
  document.querySelectorAll(".m-img").forEach(e=>e.classList.toggle("hide",m!=="img"));
  document.querySelectorAll(".m-cap").forEach(e=>e.classList.toggle("hide",m!=="cap"));
  document.querySelectorAll(".m-vis").forEach(e=>e.classList.toggle("hide",m==="cap"));
  $("tamp").classList.toggle("hide",m==="cap");
  $("detail").classList.toggle("hide",m==="img");
  const l=LAB[m];
  $("lj").innerHTML=l.lj;$("ls").innerHTML=l.ls;$("li").innerHTML=l.li;$("oh").textContent=l.oh;$("ai").textContent=l.ai;
  $("out").value="";msg("ost","");
}
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)setMode(t.dataset.m)});

function info(d){
  const a=["Nama produk: "+d.judul];
  if(d.sub)a.push("Tagline: "+d.sub);
  if(d.isi)a.push("Isi produk: "+d.isi.replace(/\n+/g,"; "));
  if(d.harga)a.push("Harga atau promo: "+d.harga);
  if(d.target)a.push("Target pembeli: "+d.target);
  a.push("Gaya bahasa: "+d.bahasa);
  return a.join("\n");
}
function capP(d){
  return ["Bertindaklah sebagai copywriter TikTok untuk jualan online di Indonesia.","Buatkan 3 pilihan caption TikTok untuk produk berikut.","",info(d),"","Ketentuan:","- Kalimat pertama berupa hook yang membuat orang berhenti scroll.","- Panjang caption: "+d.panjang+", belum termasuk hashtag.","- Sisipkan ajakan bertindak: "+(d.cta||"klik link di bio untuk beli")+".","- Pakai emoji secukupnya.","- Akhiri dengan "+d.hashtag+" hashtag yang relevan, campuran yang populer dan yang spesifik.","- Pakai hanya informasi di atas. Jangan mengarang fitur, angka, testimoni, atau garansi.","","Format jawaban: Caption 1, Caption 2, Caption 3, masing-masing lengkap dengan hashtag."].join("\n");
}
function lynkP(d,direct){
  const spec=build(Object.assign({},d,{jenis:"Product thumbnail",rasio:"1:1 square, exactly 1024x1024 pixels"}));
  const o1=direct
   ?"OUTPUT 1 - PROMPT THUMBNAIL 1024x1024 PIKSEL\nTulis satu prompt bahasa Inggris yang siap ditempel ke generator gambar, berdasarkan spesifikasi di bawah. Semua teks dalam tanda kutip harus tetap persis."
   :"OUTPUT 1 - THUMBNAIL 1024x1024 PIKSEL\nBuat gambarnya langsung (ukuran persis 1024x1024 piksel, rasio 1:1) berdasarkan spesifikasi di bawah.";
  return ["Saya akan mengunggah produk di lynk.id. Buatkan 3 output dalam satu jawaban, beri label yang jelas.","",o1,"--- spesifikasi ---",spec,"--- akhir spesifikasi ---","","OUTPUT 2 - JUDUL PRODUK","Maksimal 100 karakter termasuk spasi. Jelas, menarik, dan memuat kata kunci utama produk. Tulis jumlah karakternya di belakang judul.","","OUTPUT 3 - KETERANGAN PRODUK","Deskripsi yang menarik dan sesuai produk. Urutan: kalimat pembuka yang menarik, apa saja yang didapat (poin-poin sesuai isi produk), manfaat bagi pembeli, cocok untuk siapa, kalimat promosi yang mengajak membeli (misalnya urgensi, bonus, atau kemudahan), lalu penutup berisi ajakan beli sekarang.","Pakai hanya informasi di bawah. Jangan mengarang fitur, angka, testimoni, atau garansi.","",info(d)].join("\n");
}
function mk(d){return mode==="cap"?capP(d):mode==="lynk"?lynkP(d,false):build(d)}

$("build").addEventListener("click",()=>{
  const d=data();
  if(!d.judul){msg("ost",mode==="img"?"Judul wajib diisi.":"Nama produk wajib diisi.","err");$("judul").focus();return}
  $("out").value=mk(d);msg("ost","Prompt dibuat. Salin dan tempel ke ChatGPT.","ok");
});
$("ai").addEventListener("click",async()=>{
  const d=data();
  if(!d.judul){msg("ost",mode==="img"?"Judul wajib diisi.":"Nama produk wajib diisi.","err");$("judul").focus();return}
  const b=$("ai");b.disabled=true;msg("ost","Gemini sedang bekerja...");
  const sys="You are an expert prompt engineer for ChatGPT image generation. Rewrite the draft into one polished English prompt. Rules: keep every quoted text string (title, subtitle, content) exactly as written, character for character, and tell the model to render them exactly. Keep the title extremely large, the subtitle fairly large, the content large and clearly visible. Keep the style, lighting, quality keywords and color hex codes. Add concrete layout and composition details. Output only the final prompt with no preamble, no markdown, and no explanation.";
  try{
    if(mode==="img"){
      $("out").value=await gemini(build(d),sys);msg("ost","Prompt disempurnakan oleh Gemini.","ok");
    }else{
      const t=await gemini(mode==="cap"?capP(d):lynkP(d,true));
      $("out").value=t;
      msg("ost",mode==="cap"?"Caption dibuat oleh Gemini.":"Paket dibuat oleh Gemini. Prompt thumbnail di Output 1 bisa ditempel ke ChatGPT.","ok");
    }
  }catch(e){msg("ost","Gagal: "+e.message,"err")}
  b.disabled=false;
});
$("copy").addEventListener("click",async()=>{
  const v=$("out").value;
  if(!v){msg("ost","Belum ada prompt untuk disalin.","err");return}
  try{await navigator.clipboard.writeText(v)}catch(e){$("out").select();document.execCommand("copy")}
  msg("ost","Prompt disalin.","ok");
});
setMode("img");
</script>
</body>
</html>
